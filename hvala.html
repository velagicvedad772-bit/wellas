<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hvala vam! | Wellas</title>

    <!-- AUTO REDIRECT nakon 5 sekundi -->
    <meta http-equiv="refresh" content="5;url=index.html">

    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #0a192f;
            --accent: #64ffda;
            --white: #e6f1ff;
            --grey: #8892b0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        .container {
            max-width: 700px;
            padding: 40px;
        }

        .emoji {
            font-size: 5rem;
            margin-bottom: 20px;
            display: block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }

        h1 {
            font-size: clamp(3rem, 8vw, 4.5rem);
            font-weight: 800;
            margin-bottom: 25px;
            letter-spacing: -1px;
        }

        p {
            font-size: 1.4rem;
            color: var(--grey);
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .redirect-text {
            font-size: 1rem;
            margin-bottom: 40px;
            opacity: 0.8;
        }

        .btn-back {
            display: inline-block;
            padding: 20px 45px;
            border: 2px solid var(--accent);
            color: var(--accent);
            text-decoration: none;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-radius: 8px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 1.1rem;
        }

        .btn-back:hover {
            background: var(--accent);
            color: var(--bg-deep);
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(100, 255, 218, 0.4);
        }

        .highlight {
            color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="container" data-aos="zoom-in">

        

        <h1><span class="highlight">Hvala</span> <span class="highlight">vam!</span></h1>

        <p>
            Vaša poruka je uspješno stigla do nas.  
            Naš tim će je pregledati i javiti vam se u najkraćem roku.
        </p>

        <p class="redirect-text">
            Bićete automatski preusmjereni na početnu stranicu...
        </p>

        <a href="index.html" class="btn-back">Nazad na početnu</a>

    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script>
        AOS.init({ duration: 1000 });

        // dodatni sigurni redirect (ako meta ne odradi)
        setTimeout(function() {
            window.location.href = "index.html";
        }, 5000);
    </script>

</body>
</html>
