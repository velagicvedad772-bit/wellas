<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellas | Kontakt</title>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a192f;
            --bg-light: #112240;
            --accent: #64ffda;
            --white: #e6f1ff;
            --grey: #8892b0;
            --transition: all 0.4s cubic-bezier(0.645, 0.045, 0.355, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            color: var(--white);
            line-height: 1.6;
            overflow-x: hidden;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 10%;
            background-color: rgba(10, 25, 47, 0.85);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(100, 255, 218, 0.1);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 2px;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 30px;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--white);
            font-size: 0.9rem;
            transition: var(--transition);
        }

        nav ul li a:hover {
            color: var(--accent);
        }

        .contact-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 140px 10% 80px;
        }

        .contact-intro {
            text-align: center;
            max-width: 700px;
            margin-bottom: 50px;
        }

        .contact-intro h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            margin-bottom: 20px;
        }

        .contact-intro p {
            color: var(--grey);
            font-size: 1.1rem;
        }

        .contact-wrapper {
            width: 100%;
            max-width: 700px;
            background: var(--bg-light);
            padding: 45px;
            border-radius: 14px;
            border: 1px solid rgba(100, 255, 218, 0.1);
            box-shadow: 0 20px 30px -15px rgba(2, 12, 27, 0.5);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: var(--accent);
            font-family: monospace;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 15px;
            background: var(--bg-deep);
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-radius: 4px;
            color: var(--white);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(100, 255, 218, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            font-weight: 800;
            cursor: pointer;
            border-radius: 4px;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1rem;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: rgba(100, 255, 218, 0.1);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px -10px var(--accent);
        }

        footer {
            padding: 60px 0;
            text-align: center;
            color: var(--grey);
            border-top: 1px solid rgba(100, 255, 218, 0.1);
        }

        .highlight {
            color: var(--accent);
        }

        .honeypot {
            display: none;
        }

        @media (max-width: 768px) {
            nav ul {
                display: none;
            }

            .contact-wrapper {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">WELLAS</a>
        <ul>
            <li><a href="index.html">Početna</a></li>
            <li><a href="o-nama.html">O nama</a></li>
            <li><a href="kontakt.html" style="color: var(--accent);">Kontakt</a></li>
        </ul>
    </nav>

    <section class="contact-page">
        <div class="contact-intro" data-aos="fade-down">
            <h1>Kontaktirajte <span class="highlight">nas</span>.</h1>
            <p>Pošaljite nam detalje o projektu i javićemo vam se u roku od 24 sata.</p>
        </div>

        <div class="contact-wrapper" data-aos="fade-up">
            <form action="posalji.php" method="POST">
                
                <div class="honeypot">
                    <label for="website">Website</label>
                    <input type="text" id="website" name="website" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="ime">VAŠE IME</label>
                    <input type="text" id="ime" name="Ime" placeholder="Npr. Marko Marković" required>
                </div>

                <div class="form-group">
                    <label for="email">VAŠ EMAIL</label>
                    <input type="email" id="email" name="Email" placeholder="ime@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="poruka">OPIS PROJEKTA</label>
                    <textarea id="poruka" name="Poruka" rows="6" placeholder="O čemu se radi?" required></textarea>
                </div>

                <button type="submit" class="submit-btn">Pošalji Upit</button>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 <strong class="highlight">WELLAS</strong>. Sva prava pridržana.</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 1000,
            once: true
        });
    </script>
</body>
</html>
